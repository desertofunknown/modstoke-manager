[package]
name = "openacai-mod-manager"
version = "0.2.0"
description = "Modstoke Manager by OpenACAI, an independent game and dedicated-server toolkit for Sons of the Forest."
authors = ["Alex Cooper"]
license = "GPL-3.0-or-later"
repository = "https://github.com/desertofunknown/modstoke-manager"
edition = "2021"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
zip = "0.5"
tokio = { version = "1", features = ["net", "time", "io-util"] }
regex = "1"
winreg = "0.55"
keyring = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
png = "0.17"
texture2ddecoder = "0.1"
tempfile = "3"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dependencies.windows]
version = "0.33.0"
features = [
    "alloc",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]

[features]
# Tauri enables this for production builds and when frontendDist points to the filesystem.
custom-protocol = ["tauri/custom-protocol"]
